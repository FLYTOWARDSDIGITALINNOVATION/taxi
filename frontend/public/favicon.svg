<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#FFD700" />
  
  <!-- Letter N -->
  <text x="50" y="75" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" fill="#1A1A1A" text-anchor="middle">N</text>
  
  <!-- Taxi Checkerboard Bottom -->
  <g fill="#1A1A1A">
    <rect x="0" y="90" width="12.5" height="10" />
    <rect x="25" y="90" width="12.5" height="10" />
    <rect x="50" y="90" width="12.5" height="10" />
    <rect x="75" y="90" width="12.5" height="10" />
  </g>
</svg>